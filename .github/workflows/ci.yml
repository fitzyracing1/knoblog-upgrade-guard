name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet "knoblog>=0.1.1"
      - name: Unit tests + live end-to-end diff (gunicorn 20.1.0 -> 23.0.0)
        env:
          GUARD_NETWORK: '1'
        run: python -m unittest discover -s tests -v
